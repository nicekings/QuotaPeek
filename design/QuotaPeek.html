<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QuotaPeek · Mẫu giao diện</title>
<style>
:root{--foreground:CanvasText;--muted:GrayText;--card:Canvas;--border:color-mix(in srgb,CanvasText 24%,transparent);--radius:14px;--font-sans:"Segoe UI Variable Text","Segoe UI",Arial,sans-serif;color-scheme:light dark}
*{box-sizing:border-box}
body{margin:0;font:14px/1.45 var(--font-sans);color:var(--foreground)}
main{max-width:920px;margin:auto}
button,select,input{font:inherit}button,summary,input[type=checkbox],select{cursor:pointer}
button{color:inherit}button:focus-visible,summary:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #48a8ed;outline-offset:2px}
nav{display:flex;gap:5px;flex-wrap:wrap;margin:0 0 12px}
nav button{background:transparent;color:var(--foreground);border:1px solid transparent;padding:7px 12px;border-radius:20px;font-weight:600}
nav button[aria-pressed=true]{background:var(--card);border-color:var(--border)}
.scene{--ink:#17292d;--dim:#526366;--surface:#f5f8f7;--panel:#fff;--line:#d8e1df;--orange:#b76241;--green:#23816a;--tray:#e4eeeb;position:relative;isolation:isolate;overflow:hidden;border-radius:16px;color:var(--ink);min-height:465px;display:flex;flex-direction:column;align-items:flex-end;padding:26px 20px 0;background:radial-gradient(ellipse at 95% -25%,#f3f1d5,transparent 59%),linear-gradient(125deg,#477a80,#a5c7b6 53%,#e1dfc2);color-scheme:light}
.scene::before,.scene::after{content:"";position:absolute;z-index:-1;pointer-events:none;transform:rotate(-36deg);border-radius:48%;width:110%;height:100%;left:-46%;top:27%;box-shadow:14px -12px 40px #27494728,inset -9px 6px 25px #e3f1db55;background:linear-gradient(153deg,#487880,#386975 57%,#8fbbad)}
.scene::after{left:-52%;top:52%;background:linear-gradient(135deg,#719c94,#335e6c 70%)}
.scene[data-view=board]{--ink:#edf2ed;--dim:#b4c2bd;--surface:#202a2b;--panel:#2b3535;--line:#435050;--orange:#f0a477;--green:#77cfac;--tray:#233238;background:linear-gradient(135deg,#1e3c48,#536968);color-scheme:dark}
.scene[data-view=board]::before,.scene[data-view=board]::after{filter:brightness(.63)}
.scene[data-view=compact]{background:linear-gradient(130deg,#797986,#d3c9b9 76%);--surface:#faf8f3;--panel:#fffefb;--line:#dedbd1;--tray:#e9e5da}
.scene[data-view=compact]::before,.scene[data-view=compact]::after{filter:sepia(.6)}
.window{width:min(100%,380px);border:1px solid color-mix(in srgb,var(--surface) 72%,transparent);border-radius:14px;background:var(--surface);box-shadow:0 12px 40px #15363132,0 2px 7px #18332e22;overflow:hidden;margin-top:auto}
header,.foot,.provider,.row,.label,.settingsline,.taskbar,.trayicons,.brand{display:flex;align-items:center}
header{gap:9px;padding:14px 17px;border-bottom:1px solid var(--line)}
.brand{gap:8px;font-weight:700;letter-spacing:-.35px}.brand img{width:23px;height:23px;border-radius:6px}
.icon{width:30px;height:30px;background:transparent;border:1px solid transparent;border-radius:7px;display:grid;place-items:center;padding:0}
.icon:hover{background:var(--line)}svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.end{margin-left:auto}.inner{padding:15px}.eyebrow{font-size:10px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--dim)}
h1,h2,p{margin:0}h1{font-size:22px;line-height:1.22;letter-spacing:-.75px}h2{font-size:14px;letter-spacing:-.15px}
.heading{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:0 0 12px}
small,.sub{color:var(--dim);font-size:11px;font-weight:400}
.card{border:1px solid var(--line);background:var(--panel);padding:12px 14px;border-radius:10px;margin-top:8px}
.provider{gap:9px}.mark{width:26px;height:26px;border-radius:8px;background:color-mix(in srgb,var(--orange) 15%, var(--panel));display:grid;place-items:center;color:var(--orange);font-size:19px;line-height:1;font-family:"Segoe UI Symbol",sans-serif}
.codex .mark{background:color-mix(in srgb,var(--green) 13%,var(--panel));color:var(--green);font:700 13px Consolas,monospace}
.label{justify-content:space-between;margin:9px 0 4px;font-size:12px}.label b{font-variant-numeric:tabular-nums}
.track{height:5px;border-radius:6px;overflow:hidden;background:var(--line)}.track i{display:block;height:100%;width:var(--pct);border-radius:inherit;background:var(--provider-color,var(--orange))}
.codex{--provider-color:var(--green)}.reset{margin-top:3px}
.foot{border-top:1px solid var(--line);gap:12px;padding:10px 16px;color:var(--dim);font-size:11px;font-variant-numeric:tabular-nums}.foot b{color:var(--ink);font-weight:600}
.taskbar{align-self:stretch;justify-content:space-between;gap:8px;margin:12px -20px 0;padding:7px 20px;background:var(--tray);border-top:1px solid #ffffff46;min-height:43px}
.window[hidden]+.taskbar{margin-top:auto}.trayicons{gap:12px}.win{display:grid;grid-template-columns:6px 6px;grid-template-rows:6px 6px;gap:1px}.win i{background:var(--dim)}.clock{font-size:11px;line-height:1.15;text-align:right;font-variant-numeric:tabular-nums}.traybtn{background:var(--panel);border:1px solid var(--line);padding:3px 7px;border-radius:5px;font-size:11px;font-weight:650;display:flex;align-items:center;gap:6px}.traybtn img{width:16px;height:16px}
[data-view=board] .window{width:min(100%,540px);margin-bottom:auto}
.boardgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.boardgrid .card{margin:0}.big{font-size:34px;letter-spacing:-1.6px;font-weight:650;line-height:1.3;font-variant-numeric:tabular-nums}.big span{font-size:18px}.boardgrid .eyebrow{margin-top:18px}
details{border-bottom:1px solid var(--line);padding:8px 0}details:last-child{border:0}summary{list-style:none;display:flex;align-items:center;gap:8px}summary::-webkit-details-marker{display:none}summary:after{content:"›";font-size:18px;line-height:1;color:var(--dim)}details[open] summary:after{transform:rotate(90deg)}
[data-view=compact] .window{width:min(100%,332px)}.compactvalue{margin-left:auto;text-align:right;font-size:16px;font-weight:650;line-height:1.15}.compactvalue small{display:block;font-size:10px}
.settingsline{padding:11px 0;border-bottom:1px solid var(--line);gap:10px;justify-content:space-between}.settingsline:last-child{border:0}.settingsline input{width:18px;height:18px;accent-color:var(--green)}select{max-width:55%;border:1px solid var(--line);border-radius:6px;padding:4px;background:var(--panel);color:inherit}
.note{color:var(--muted);font-size:12px;margin:9px 0 2px}
[hidden]{display:none!important}
@media(max-width:450px){nav{gap:2px}nav button{font-size:12px;padding:6px 9px}.scene{padding:16px 9px 0}.taskbar{margin-left:-9px;margin-right:-9px;padding:7px 12px}.inner{padding:12px}.boardgrid{gap:6px}.boardgrid .card{padding:9px}.foot{gap:8px;padding:9px 12px}.heading{flex-wrap:wrap}}
</style></head><body>

<script>
const qs=s=>document.querySelector(s);
const scene=qs('.scene'),pane=qs('#content'),settings=qs('#settings'),win=qs('.window'),tray=qs('.traybtn');
const services=[
 {name:'Claude',plan:'Max',glyph:'✳',kind:'claude',limits:[['5 giờ',48,'1 giờ 27 phút','23/11 15:29'],['Tuần',54,'3 ngày','26/11 14:02']]},
 {name:'Codex',plan:'Prolite',glyph:'›_',kind:'codex',limits:[['Tuần',81,'5 ngày','28/11 14:02']]}
];
function provider(s){return '<span class="mark" aria-hidden="true">'+s.glyph+'</span><h2>'+s.name+'</h2><small>· '+s.plan+'</small>'}
function track(p){return '<div class="track" aria-hidden="true"><i style="--pct:'+p+'%"></i></div>'}
function reset(l){return qs('#time').value==='relative'?'Đặt lại sau '+l[2]:'Đặt lại lúc '+l[3]}
function metric(l){return '<div class="label"><span>'+l[0]+'</span><b>'+l[1]+'%</b></div>'+track(l[1])+'<small class="reset">'+reset(l)+'</small>'}
function paint(){
 const view=scene.dataset.view;
 const title=view==='fly'?'Hạn mức AI':view==='board'?'Hạn mức tuần':'Cạnh đồng hồ';
 let html='<div class="heading"><h1>'+title+'</h1><small>Đã đọc lúc 14:02</small></div>';
 if(view==='fly')html+=services.map(s=>'<article class="card '+s.kind+'"><div class="provider">'+provider(s)+'</div>'+s.limits.map(metric).join('')+'</article>').join('');
 if(view==='board'){html+='<div class="boardgrid">'+services.map(s=>{const l=s.limits[s.limits.length-1];return '<article class="card '+s.kind+'"><div class="provider">'+provider(s)+'</div><div class="eyebrow">Tuần còn lại</div><div class="big">'+l[1]+'<span>%</span></div>'+track(l[1])+'<small>'+reset(l)+'</small></article>'}).join('')+'</div><article class="card"><div class="provider"><h2>Claude</h2><small>· Hạn mức ngắn</small></div>'+metric(services[0].limits[0])+'</article>'}
 if(view==='compact')html+=services.map(s=>{const l=s.limits[0];return '<details class="'+s.kind+'"><summary>'+provider(s)+'<span class="compactvalue">'+l[1]+'%<small>'+l[0]+'</small></span></summary>'+s.limits.map(metric).join('')+'</details>'}).join('');
 pane.innerHTML=html;
 qs('#traysignal').textContent=view==='compact'?'48% · 81%':'QuotaPeek';
 qs('#pc').hidden=!qs('#hardware').checked||!settings.hidden;
}
function showSettings(open){settings.hidden=!open;pane.hidden=open;qs('#gear').setAttribute('aria-expanded',open);paint()}
function showWindow(open){win.hidden=!open;tray.setAttribute('aria-expanded',open);if(!open)showSettings(false)}
document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{scene.dataset.view=b.dataset.go;document.querySelectorAll('[data-go]').forEach(x=>x.setAttribute('aria-pressed',x===b));showWindow(true);showSettings(false)});
qs('#gear').onclick=()=>showSettings(settings.hidden);qs('#close').onclick=()=>{showWindow(false);tray.focus()};tray.onclick=()=>showWindow(win.hidden);
scene.onclick=e=>{if(e.target===scene)showWindow(false)};document.onkeydown=e=>{if(e.key==='Escape'&&!win.hidden){if(!settings.hidden){showSettings(false);qs('#gear').focus()}else{showWindow(false);tray.focus()}}};
qs('#hardware').onchange=paint;qs('#time').onchange=paint;paint();
</script></body></html>
